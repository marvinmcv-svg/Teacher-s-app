<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Tinta</title>
    <style>
      :root { --paper: #fbf8f3; --ink: #1e1b18; --muted: #6b645c; }
      @media (prefers-color-scheme: dark) { :root { --paper: #14120f; --ink: #f2ede6; --muted: #a89f94; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; padding: 16px; }
      main { max-width: 28rem; }
      h1 { font-family: Georgia, serif; font-weight: 400; font-size: 2rem; margin: 0 0 .5rem; }
      p { color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>Tus fotos escaneadas están guardadas en este dispositivo y se subirán cuando vuelvas a tener internet y abras Tinta.</p>
      <p lang="en">You're offline. Scanned photos are saved on this device and will upload when you're back online and open Tinta.</p>
    </main>
  </body>
</html>
